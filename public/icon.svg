<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#0F172A" />
  
  <!-- Subtle inner background glow -->
  <circle cx="256" cy="256" r="180" fill="url(#pulse-grad)" opacity="0.15" filter="blur(30px)" />
  
  <!-- Outer Progress Ring (75% complete) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#pulse-grad)" stroke-width="24" 
          stroke-dasharray="1068" stroke-dashoffset="267" stroke-linecap="round" 
          transform="rotate(-90 256 256)" filter="url(#glow)" />
  
  <!-- Central Pulse / Flame & Checkmark Motif -->
  <!-- Checkmark -->
  <path d="M180 260 L235 315 L335 195" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Streak Flame Spark on top right -->
  <path d="M340 140 C340 140 375 165 375 195 C375 215 360 230 340 230 C320 230 310 210 310 195 C310 165 340 140 340 140 Z" fill="#F59E0B" />
  <path d="M340 165 C340 165 355 180 355 198 C355 208 348 215 340 215 C332 215 328 205 328 198 C328 180 340 165 340 165 Z" fill="#FBBF24" />
</svg>
